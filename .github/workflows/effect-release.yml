name: Effect release

# The `effect` peer of Envi accepts every patch of one minor version, and the daily CI run tests
# the newest patch. A new minor version needs a new Envi release. Dependabot skips a Bun catalog
# (dependabot/dependabot-core#14320), so this workflow opens an issue when npm has a new minor
# version of `effect`. Effect publishes its packages hours or a day apart, so the workflow waits
# until npm has every `@effect/*` package of the catalog at the first patch of that minor version.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open an issue for a newer Effect
        # `bash` runs the step with `pipefail`, so a failed `npm view` fails the job.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(jq -r '.workspaces.catalog.effect' package.json)
          floor=${current#\~}
          # The newest version at or above the floor.
          newest=$(npm view "effect@>=$floor" version --json | jq -r 'if type == "array" then last else . end')

          if [ "${newest%.*}" = "${floor%.*}" ]; then
            echo "The range $current covers effect@$newest. The daily CI run tests it."
            exit 0
          fi

          # The first patch of the new minor version, for `effect` and each `@effect/*` package.
          target="${newest%.*}.0"
          missing=""
          for name in effect $(jq -r '.workspaces.catalog | keys[] | select(startswith("@effect/"))' package.json); do
            if ! answer=$(npm view "$name@$target" version --json 2>/dev/null); then
              if [ "$(echo "$answer" | jq -r '.error.code? // empty')" != "E404" ]; then
                echo "npm view $name@$target failed."
                exit 1
              fi

              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "npm has effect@$newest, but not yet$missing at $target."
            exit 0
          fi

          title="Move to effect@~$target"

          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            echo "An open issue already asks for effect@~$target."
            exit 0
          fi

          gh issue create --title "$title" --body "npm has \`effect@$newest\`, a new minor version. The catalog asks for \`$current\`.

          1. In the catalog of the root \`package.json\`, set \`effect\` to \`$target\` and every \`@effect/*\` entry to \`$target\`. Run \`bun install\`, then set \`effect\` back to \`~$target\` and run \`bun install\` again, so the lockfile tests the floor.
          2. Run \`bun run versions\`.
          3. Run \`bun run verify\`, and fix every import that the release moved.
          4. Merge the change, and release Envi."
