name: Release

# A tag `v<version>` on a commit of `main` publishes every package at that version. The tag must
# match the version of the root manifest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time. A second tag waits for the first release to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusts this workflow in this environment, and only a `v*` tag can use the environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run release --tag "$GITHUB_REF_NAME"
        env:
          NPM_CONFIG_PROVENANCE: "true"

  release-page:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The page lists the pull requests since the previous release. A rerun keeps an existing page.
      - name: create the GitHub release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
